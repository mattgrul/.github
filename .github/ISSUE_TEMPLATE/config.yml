# Every issue starts from a form. The tracker holds defects and agreed
# work, and the two forms are the shape of those. A question goes to
# Discussions, which CONTRIBUTING.md says.
blank_issues_enabled: false

contact_links:
  # This is the point of the file. It catches someone at the moment they
  # would otherwise file a vulnerability as a public issue.
  - name: Report a security vulnerability
    url: https://github.com/mattgrul/.github/security/policy
    about: Never open a public issue. Use the Security tab.
