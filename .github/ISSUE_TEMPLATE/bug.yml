# Inherited by every repository this account owns, so it assumes nothing
# about a language, a runtime or an operating system. The first three fields
# are the shape of a good bug report in any domain. Anything more specific
# belongs in the placeholder, where it guides without constraining.
name: Bug report
description: Something behaves differently from how it should
labels: [bug]

body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest sequence that shows the problem.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever is relevant here.
      placeholder: |
        Your operating system, and the version of whatever this uses.
        For example: bash --version, tofu version, node --version
    validations:
      required: false

  - type: textarea
    id: more
    attributes:
      label: Output, logs, or anything else
      render: text
    validations:
      required: false
