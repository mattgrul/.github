# Inherited by every repository this account owns, so it assumes nothing
# about a language, a runtime or an operating system. The first three fields
# are the shape of a good bug report in any domain. The environment field
# asks for relevant context without assuming specific tools.
name: Bug report
description: Something behaves differently from how it should
# A category role and a state role, which is what a triaged issue carries.
# Both labels must exist in every repository this template reaches, or
# GitHub drops the missing one without a warning.
labels: [bug, needs-triage]

body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest sequence that shows the problem.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever is relevant here.
      placeholder: |
        The versions and the conditions that affect the problem.
    validations:
      required: false

  - type: textarea
    id: more
    attributes:
      label: Output, logs, or anything else
      render: text
    validations:
      required: false
