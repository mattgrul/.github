# The form behind the Q&A category, where CONTRIBUTING.md sends a
# support question. Inherited by every repository this account owns
# that has Discussions on, so it assumes nothing about the subject.
# The file name must match the category slug, which is q-a for the
# category GitHub creates as "Q&A".
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The commands, the settings, or the steps, and what
        happened.
    validations:
      required: true

  - type: textarea
    id: looked
    attributes:
      label: Where you looked
      description: The README, a document, or an earlier discussion.
    validations:
      required: false
