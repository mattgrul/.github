# The form behind the Ideas category. It catches a thought before it is
# a proposal. CONTRIBUTING.md sends a proposal to the Feature request
# form, because accepted work is tracked on the issue tracker.
# Inherited by every repository this account owns that has Discussions
# on, so it assumes nothing about the subject. The file name must match
# the category slug, which is ideas for the category GitHub creates as
# "Ideas".
body:
  - type: markdown
    attributes:
      value: |
        A discussion is for an idea that is not yet a proposal. When
        you can say what problem it solves and what you want to happen,
        open a **Feature request** issue instead.

  - type: textarea
    id: problem
    attributes:
      label: What you keep running into
      description: The situation, not the change you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What might help
    validations:
      required: false
