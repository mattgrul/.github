# The shell test suite, for every repository that calls it.
#
# It takes no inputs on purpose. A caller meets a convention instead:
# `tests/all` runs the suite and `tests/shellcheck.sh` lints the scripts.
# That keeps the interface at zero and leaves no ${{ inputs.* }} to reach a
# run: block. Add an input when a repository genuinely cannot meet the
# convention, and not before.
name: Shell tests

on: workflow_call

permissions:
  contents: read

jobs:
  test:
    strategy:
      # A macOS failure must not cancel the Linux run. When bash 3.2 breaks
      # something, both answers are worth having.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where any
          # later step can read it. Nothing here needs to push.
          persist-credentials: false

      # /bin/bash by name, not by PATH. macOS runners put Homebrew's bash 5
      # first, and this job exists to test Apple's bash 3.2 -- the version a
      # `#!/bin/bash` script actually gets on a Mac. A bare ./tests/all would
      # pass while proving nothing.
      - run: /bin/bash tests/all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Once only. shellcheck reads the same scripts and reaches the same
      # verdict on either runner.
      - run: ./tests/shellcheck.sh
