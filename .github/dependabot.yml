# Keep what the workflows and the gitleaks scan here pin current: the
# actions, and the gitleaks image. A release then carries the new pins
# to each caller.
#
# A commit or digest pin stops a retargeted tag from changing what runs,
# but it also freezes the version. The cooldown holds a new release back
# for two days, so a malicious one has time to be found before it is
# offered here.
#
# Dependabot adds an ecosystem label beside `dependencies` by default.
# mattgrul/personal-infra names only `dependencies` on every repository
# and deletes a label it does not name, so this keeps Dependabot to the
# one label.
version: 2
updates:
  # "/" covers .github/workflows. Dependabot reads an action.yml only in
  # a folder named here.
  - package-ecosystem: github-actions
    directories:
      - /
      - /gitleaks-scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /gitleaks-scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    labels:
      - dependencies
