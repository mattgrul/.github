# Keep this repository's pinned actions current.
#
# Dependabot only updates the repository it sits in, so this covers the
# actions inside shell-tests.yml -- which is every caller's benefit, since
# those pins live here rather than in each caller. A caller still needs its
# own dependabot.yml for the pin that points back at this workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
